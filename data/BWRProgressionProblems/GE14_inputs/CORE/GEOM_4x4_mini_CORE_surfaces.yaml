        axial_bounds: [35.40765, 80.56885]
        assembly_geometry_file: "../ASSEMBLY/GEOM_GE14_DOM_surfaces.yaml"
      - axial_region: "GRID"
        axial_bounds: [80.56885, 84.69635]
        assembly_geometry_file: "../ASSEMBLY/GEOM_GE14_GRID_DOM_surfaces.yaml"
      - axial_region: "DOM"
        axial_bounds: [84.69635, 129.85755]
        assembly_geometry_file: "../ASSEMBLY/GEOM_GE14_DOM_surfaces.yaml"
      - axial_region: "GRID"
        axial_bounds: [129.85755, 133.98505]
        assembly_geometry_file: "../ASSEMBLY/GEOM_GE14_GRID_DOM_surfaces.yaml"
      - axial_region: "DOM"
