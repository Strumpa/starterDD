# Geometry description for the GE14 BWR progression problem.
# This file describes the geometry for the BOTTOM PLENUM axial region.
# In this region the water rods are cone-shaped: they taper from a small
# connection radius at the bottom of the plenum (outer_radius_start) to the
# full nominal radius at the top where they connect to the DOM region
# (outer_radius_end = nominal DOM radius).
# The cone profile is interpolated linearly between these two values over the
# axial extent of the PLENUM_BOT tranche as defined in the core YAML.

PIN_GEOMETRY:
  fuel_radius: 0.438
  gap_radius: 0.447
  clad_radius: 0.515
  pin_pitch: 1.3
  grid_thickness: 0.0
  self_shielding_option: "Santamarina"

ASSEMBLY_GEOMETRY:
  lattice_type: "cartesian"
  reactor_type: "BWR"
  lattice_description:
    - ["ROD2", "ROD5", "ROD7", "ROD7", "ROD7", "ROD7", "ROD7", "ROD7", "ROD7", "ROD3"]
    - ["ROD5", "ROD5", "ROD6H", "ROD7", "ROD7", "ROD7G", "ROD7", "ROD7G", "ROD7", "ROD7"]
    - ["ROD5", "ROD6H", "ROD6", "ROD7", "ROD7", "ROD7", "ROD7G", "ROD7", "ROD7G", "ROD7"]
    - ["ROD5", "ROD5", "ROD6H", "WROD", "WROD", "ROD7", "ROD7", "ROD7G", "ROD7", "ROD7"]
    - ["ROD5", "ROD5G", "ROD6", "WROD", "WROD", "ROD7", "ROD7", "ROD7", "ROD7G", "ROD7"]
    - ["ROD5", "ROD4", "ROD7H", "ROD5", "ROD7", "WROD", "WROD", "ROD7", "ROD7", "ROD7"]
    - ["ROD5", "ROD5", "ROD6", "ROD7G", "ROD5", "WROD", "WROD", "ROD7", "ROD7", "ROD7"]
    - ["ROD3", "ROD3", "ROD6K", "ROD6", "ROD7H", "ROD6", "ROD6H", "ROD6", "ROD6H", "ROD7"]
    - ["ROD2", "ROD2", "ROD3", "ROD5", "ROD4", "ROD5G", "ROD5", "ROD6H", "ROD5", "ROD5"]
    - ["ROD1", "ROD2", "ROD3", "ROD5", "ROD5", "ROD5", "ROD5", "ROD5", "ROD5", "ROD2"]

  Gd_rod_ids: ["ROD5G", "ROD6H", "ROD6K", "ROD7G", "ROD7H"]
  non_fuel_rod_ids: ["WROD"]

  assembly_box_description:
    surfaces:
      - name: "problem_boundaries"
        surface_id: 0
        type: "square"
        parameters:
          center: [7.62, 7.62]
          side_length: 15.24
        fill_material: "moderator"
      - name: "outer_channel_box"
        type: "square"
        surface_id: 1
        parameters:
          center: [7.62, 7.62]
          side_length: 13.7302
          radius_of_curvature: 1.301
        fill_material: "channel_box"
      - name: "inner_channel_box"
        surface_id: 2
        type: "square"
        parameters:
          center: [7.62, 7.62]
          side_length: 13.4
          radius_of_curvature: 0.965
        fill_material: "coolant"
      - name: "lattice_bounding_box"
        surface_id: -1
        type: "square"
        parameters:
          center: [7.62, 7.62]
          side_length: 13.0
        fill: "lattice"

WATER_ROD_GEOMETRY:
  type: "conical"
  # outer_radius_start: radius at z_start (bottom) of this plenum tranche — cone tip
  # outer_radius_end:   radius at z_end   (top)    of this plenum tranche — full nominal size
  # inner_radius_start / inner_radius_end: inner bore radius (wall_thickness = 0.075 cm is constant)
  # The radius is interpolated linearly between these two values by cartesian_geometry_analysis.py.
  outer_radius_start: 0.500   # [cm] cone tip at the bottom of the plenum
  outer_radius_end:   1.245   # [cm] nominal GE14 water rod outer radius (matches DOM)
  inner_radius_start: 0.425   # [cm] = outer_radius_start - 0.075
  inner_radius_end:   1.170   # [cm] = outer_radius_end   - 0.075
  wall_conductivity: 18.0     # Zircaloy-2 at ~280°C [W/m/K]
  centers: [[6.32, 6.32], [8.92, 8.92]]
